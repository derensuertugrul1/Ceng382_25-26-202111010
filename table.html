<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Information</title>
  <style>
    /* Burada yukarıdaki CSS'i kullanabilirsiniz */
    body {
      font-family: Arial, sans-serif;
      background-color: #ffccff; /* Pastel pembe renk */
      background-image: url('https://www.example.com/sweet-pattern.png'); /* Tatlı bir desen ekleyebilirsiniz */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9); /* Arka planı biraz opak yaparak kontrastı artırır */
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 500px;
    }

    h2 {
      text-align: center;
      color: #ff66b2; /* Tatlı pembe tonunda yazı rengi */
      margin-bottom: 20px;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      margin: 10px 0;
      width: 80%;
      border: 1px solid #ff66b2; /* Pembe kenarlık */
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #ff33cc; /* Odaklanıldığında pembe tonu */
    }

    button {
      padding: 12px;
      width: 80%;
      background-color: #ff66b2; /* Tatlı pembe buton rengi */
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #ff3399; /* Hover durumunda biraz daha koyu pembe */
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      text-align: left;
    }

    table, th, td {
      border: 1px solid #ffd1e2; /* Hafif pembe sınırlar */
    }

    th, td {
      padding: 12px;
    }

    th {
      background-color: #ffb3cc; /* Açık pembe başlık rengi */
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f9f1f9; /* Hafif pembe-somon rengi */
    }

    tr:hover {
      background-color: #ffe6f2; /* Tatlı bir pembe hover efekti */
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Class Information</h2>

    <div class="form-container">
      <input type="text" id="className" placeholder="Class Name" onfocus="inputFocus(this)" onblur="inputBlur(this)">
      <input type="number" id="numPeople" placeholder="Number of People" onfocus="inputFocus(this)" onblur="inputBlur(this)">
      <input type="text" id="description" placeholder="Description" onfocus="inputFocus(this)" onblur="inputBlur(this)">
      <button onclick="addClass()">Add Class</button>
    </div>

    <table id="classTable">
      <thead>
        <tr>
          <th>Class Name</th>
          <th>Number of People</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script>
    function addClass() {
      const className = document.getElementById('className').value;
      const numPeople = document.getElementById('numPeople').value;
      const description = document.getElementById('description').value;

      if (className && numPeople && description) {
        const table = document.getElementById('classTable').getElementsByTagName('tbody')[0];
        const newRow = table.insertRow();

        newRow.onclick = function() {
          console.log(`Class Name: ${className}, Number of People: ${numPeople}, Description: ${description}`);
          this.style.backgroundColor = '#e0e0e0';
        };

        // Double-click event
        newRow.ondblclick = function() {
          // Display detailed information
          alert(`Class Name: ${className}\nNumber of People: ${numPeople}\nDescription: ${description}`);

          // Optional: Remove the row after double-click
          if (confirm("Do you want to remove this row?")) {
            table.deleteRow(newRow.rowIndex);
          }
        };

        const cell1 = newRow.insertCell(0);
        const cell2 = newRow.insertCell(1);
        const cell3 = newRow.insertCell(2);

        cell1.textContent = className;
        cell2.textContent = numPeople;
        cell3.textContent = description;

        document.getElementById('className').value = '';
        document.getElementById('numPeople').value = '';
        document.getElementById('description').value = '';
      } else {
        alert("Please fill in all fields.");
      }
    }

    function inputFocus(input) {
      input.style.borderColor = '#ff33cc';
    }

    function inputBlur(input) {
      input.style.borderColor = '#ff66b2';
    }
  </script>

</body>
</html>
